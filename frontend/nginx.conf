server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Actor $http_x_actor;
        client_max_body_size 30m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
